<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
  }

  /* ── CANVAS FONI ── */
  #wave-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* ── BLUR OVERLAY ── */
  .blur-overlay {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(60px);
    -webkit-backdrop-filter: blur(60px);
    z-index: 1;
  }

  /* ── CONTENT ── */
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #fff;
  }

  h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #FF6B6B, #FFA500);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  p { color: rgba(255,255,255,0.5); font-size: 1.1rem; }
</style>
</head>
<body>

<canvas id="wave-canvas"></canvas>
<div class="blur-overlay"></div>

<div class="content">
  <h1>Javohir Sattorov</h1>
  <p>Python Developer · Web Developer</p>
</div>

<script>
  const canvas = document.getElementById('wave-canvas');
  const ctx    = canvas.getContext('2d');

  let W, H, t = 0;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // To'lqin parametrlari
  const blobs = [
    { x: 0.2, y: 0.3, r: 0.45, dx: 0.0003, dy: 0.0002, color: 'rgba(255,255,255,0.18)' },
    { x: 0.7, y: 0.6, r: 0.50, dx: -0.0002, dy: 0.0003, color: 'rgba(255,255,255,0.12)' },
    { x: 0.5, y: 0.1, r: 0.40, dx: 0.0002, dy: -0.0002, color: 'rgba(255,255,255,0.10)' },
    { x: 0.1, y: 0.8, r: 0.35, dx: 0.0003, dy: -0.0003, color: 'rgba(255,255,255,0.08)' },
    { x: 0.9, y: 0.2, r: 0.38, dx: -0.0003, dy: 0.0002, color: 'rgba(255,255,255,0.09)' },
  ];

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Qora fon
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    // Har bir blob — sinus harakati bilan
    blobs.forEach((b, i) => {
      const cx = (Math.sin(t * b.dx * 1000 + i) * 0.3 + b.x) * W;
      const cy = (Math.cos(t * b.dy * 1000 + i * 1.3) * 0.3 + b.y) * H;
      const r  = b.r * Math.min(W, H);

      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, b.color);
      grad.addColorStop(1, 'transparent');

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    });

    t += 1;
    requestAnimationFrame(draw);
  }

  draw();
</script>
</body>
</html>
