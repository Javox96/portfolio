<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javohir Sattorov | Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --gradient-instagram: linear-gradient(135deg, #F77737 0%, #E1306C 50%, #833AB4 100%);
            --gradient-pink-orange: linear-gradient(135deg, #FF6B6B 0%, #FFA500 100%);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --shadow-glow: 0 0 20px rgba(247, 119, 55, 0.3);
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            margin-bottom: 12px;
            background: var(--gradient-pink-orange);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .motto {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
        }

        .bio {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--text-primary);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-glow);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .card.telegram {
            grid-column: span 1;
        }

        .card.telegram:hover {
            box-shadow: 0 0 30px rgba(0, 136, 204, 0.5);
        }

        .card.instagram {
            grid-column: span 1;
            position: relative;
        }

        .card.instagram::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 2px;
            background: var(--gradient-instagram);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .card.whatsapp {
            grid-column: span 1;
        }

        .card.projects {
            grid-column: span 1;
        }

        .copy-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: var(--gradient-pink-orange);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
        }

        .copy-btn.copied {
            background: #10B981;
        }

        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 30px 15px;
            }

            .bento-grid {
                grid-template-columns: 1fr;
            }

            .card.telegram,
            .card.instagram,
            .card.whatsapp,
            .card.projects {
                grid-column: span 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero,
        .card {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .hero {
            animation-delay: 0.1s;
        }

        .card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .card:nth-child(2) {
            animation-delay: 0.3s;
        }

        .card:nth-child(3) {
            animation-delay: 0.4s;
        }

        .card:nth-child(4) {
            animation-delay: 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="hero">
            <h1>Javohir Sattorov</h1>
            <p class="motto">"Code with passion, build with purpose"</p>
            <p class="bio">Python Developer | Web Developer | Telegram Bot Specialist<br><span style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 400;">Django • HTML • CSS • SCSS • Pug</span></p>
        </section>

        <div class="bento-grid">
            <a href="https://t.me/Javokh96" target="_blank" class="card telegram">
                <div class="card-icon">✈️</div>
                <h3 class="card-title">Telegram</h3>
                <p class="card-subtitle">@Javokh96</p>
                <button class="copy-btn" id="copyTelegram">Copy Username</button>
            </a>

            <a href="https://instagram.com/javohir.sattor0v" target="_blank" class="card instagram">
                <div class="card-icon">📸</div>
                <h3 class="card-title">Instagram</h3>
                <p class="card-subtitle">@javohir.sattor0v</p>
            </a>

            <a href="https://wa.me/yournumber" target="_blank" class="card whatsapp">
                <div class="card-icon">💬</div>
                <h3 class="card-title">WhatsApp</h3>
                <p class="card-subtitle">Message me</p>
            </a>

            <a href="#" class="card projects">
                <div class="card-icon">💻</div>
                <h3 class="card-title">Recent Projects</h3>
                <p class="card-subtitle">Coming Soon</p>
            </a>
        </div>
    </div>

    <script>
        document.getElementById('copyTelegram').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const username = '@Javokh96';
            navigator.clipboard.writeText(username).then(() => {
                const btn = document.getElementById('copyTelegram');
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = 'Copy Username';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        });
    </script>
</body>
</html>
